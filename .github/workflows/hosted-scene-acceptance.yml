name: Hosted scene acceptance
on:
  pull_request:
    paths:
      - .github/workflows/hosted-scene-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-scene-acceptance
  cancel-in-progress: false
jobs:
  scenes:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'docs/system-themes-and-images'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      G9_ACCEPTANCE_URL: https://sweetroll-d2-preview.up.railway.app
      SCENE_BACKGROUND_FIXTURE: ${{ github.workspace }}/scene-evidence/scene-background-fixture.json
      G9_OUTPUT_DIR: ${{ github.workspace }}/scene-evidence/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: mkdir -p scene-evidence
      - name: Run isolated hosted background journey
        run: npx playwright test --config playwright.g9-acceptance.config.ts sceneBackgrounds.spec.ts --workers=1
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-background-evidence
          path: scene-evidence/
          retention-days: 7
