# File-only bundle (not deployed): scrape the single artifact's endpoints.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: sweetroll
    static_configs:
      - targets: ["localhost:3000"]
    metrics_path: /metrics
  - job_name: sweetroll-ready
    static_configs:
      - targets: ["localhost:3000"]
    metrics_path: /health/ready
