name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sweetroll
          POSTGRES_PASSWORD: sweetroll
          POSTGRES_USER: sweetroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweetroll -d sweetroll"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://sweetroll:sweetroll@localhost:5432/sweetroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run contracts:check
      - run: npm run build
      - run: docker build -t sweetroll:ci .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: web/package-lock.json
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  web-e2e:
    name: web-e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: journeys-1-of-3
            suite: journeys
            shard: --shard=1/3
          - name: journeys-2-of-3
            suite: journeys
            shard: --shard=2/3
          - name: journeys-3-of-3
            suite: journeys
            shard: --shard=3/3
          - name: visual
            suite: visual
            shard: ""
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sweetroll
          POSTGRES_PASSWORD: sweetroll
          POSTGRES_USER: sweetroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweetroll -d sweetroll"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      E2E_DATABASE_ADMIN_URL: postgres://sweetroll:sweetroll@localhost:5432/sweetroll
      AUTHORITATIVE_ROLL_SECRET: development-only-roll-secret-32-bytes
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: web/package-lock.json
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e -- --suite=${{ matrix.suite }} ${{ matrix.shard }}
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.name }}
          path: web/test-results/
          retention-days: 7

  web-offline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sweetroll
          POSTGRES_PASSWORD: sweetroll
          POSTGRES_USER: sweetroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweetroll -d sweetroll"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sweetroll:sweetroll@localhost:5432/sweetroll_offline
      AUTHORITATIVE_ROLL_SECRET: development-only-roll-secret-32-bytes
      SWEETROLL_TEST_AUTH: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: web/package-lock.json
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: psql postgres://sweetroll:sweetroll@localhost:5432/sweetroll -c "CREATE DATABASE sweetroll_offline;"
      - run: npm run web:build
      - run: npm --prefix web run test:offline

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, web, web-e2e, web-offline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: railway-production
      cancel-in-progress: false
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: railway up --service sweetroll --environment production --detach
