services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sweetroll
      POSTGRES_PASSWORD: sweetroll
      POSTGRES_USER: sweetroll
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweetroll -d sweetroll"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - sweetroll-postgres:/var/lib/postgresql/data

volumes:
  sweetroll-postgres:
  # I7b Task 1: validated image originals (`data/media/<storage_key>`).
  # The app container mounts it at /app/data/media, e.g.
  # `docker run -v sweetroll-media:/app/data/media sweetroll`.
  sweetroll-media:
